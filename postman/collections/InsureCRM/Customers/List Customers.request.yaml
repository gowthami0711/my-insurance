$kind: http-request
name: List Customers
method: GET
url: '{{baseUrl}}/api/customers'
order: 1000
queryParams:
  - key: search
    value: ''
    disabled: true
  - key: page
    value: '1'
  - key: sortBy
    value: newest
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
