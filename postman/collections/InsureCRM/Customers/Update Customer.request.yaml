$kind: http-request
name: Update Customer
method: PUT
url: '{{baseUrl}}/api/customers/{{customerId}}'
order: 3000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Jane Doe Updated",
      "email": "jane.doe@example.com",
      "company": "Acme Corp",
      "country": "US",
      "status": "Active"
    }
