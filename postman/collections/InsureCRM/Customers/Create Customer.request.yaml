$kind: http-request
name: Create Customer
method: POST
url: '{{baseUrl}}/api/customers'
order: 2000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Jane Doe",
      "email": "jane.doe@example.com",
      "company": "Acme Corp",
      "country": "US",
      "status": "Active"
    }
